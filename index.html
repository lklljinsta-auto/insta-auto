<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f1eb" />
  <title>인스타오토 — Instagram 운영 관리</title>
  <link rel="icon" href="./instaauto-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./readable.css" />
  <link rel="stylesheet" href="./guidance.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand-row" href="#dashboard" aria-label="인스타오토 홈">
        <img class="brand-mark" src="./instaauto-mark.svg" alt="" />
        <span class="brand-copy"><strong>인스타오토</strong><small>INSTAGRAM OPERATIONS</small></span>
      </a>
      <div class="workspace-switch"><span class="workspace-avatar">인</span><span class="workspace-label"><strong>인스타오토</strong><small>개인 운영 작업공간</small></span></div>
      <div class="nav-caption">운영 메뉴</div>
      <nav class="primary-nav" aria-label="운영 메뉴">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span>요약</span></button>
        <button class="nav-item" data-view="research"><span class="nav-icon">⌕</span><span>Instagram 계정 분석</span></button>
        <button class="nav-item" data-view="accounts"><span class="nav-icon">◎</span><span>내 운영 계정</span></button>
        <button class="nav-item" data-view="compose"><span class="nav-icon">＋</span><span>콘텐츠 작성</span></button>
        <button class="nav-item" data-view="queue"><span class="nav-icon">▤</span><span>콘텐츠 목록</span></button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon">▥</span><span>성과 기록</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>연동 상태</span></button>
      </nav>
      <div class="sidebar-note"><strong>현재 저장 방식</strong><span>이 브라우저에만 저장됩니다.</span><small>기기 간 동기화·서버 저장은 아직 연결되지 않았습니다.</small></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><strong>인스타오토</strong><span>/</span><span id="crumb-current">요약</span></div>
        <div class="topbar-status"><span class="status-dot"></span><span>Instagram API 미연결</span></div>
      </header>
      <section id="view-root" class="view-root" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
