<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f1eb" />
  <title>PostPilot — 인스타 운영 콘솔</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div class="brand-copy"><strong>postpilot</strong><small>INSTAGRAM STUDIO</small></div>
      </div>
      <div class="workspace-switch"><div class="workspace-avatar">V</div><div class="workspace-label"><strong>varo 미디어</strong><small>워크스페이스</small></div><span class="chevron">⌄</span></div>
      <div class="nav-caption">워크스페이스</div>
      <nav class="primary-nav" aria-label="주 메뉴">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span><span>대시보드</span></button>
        <button class="nav-item" data-view="accounts"><span class="nav-icon">◎</span><span>계정 &amp; IP</span><span class="nav-count">4</span></button>
        <button class="nav-item" data-view="rules"><span class="nav-icon">☷</span><span>콘텐츠 규칙</span></button>
        <button class="nav-item" data-view="automation"><span class="nav-icon">↻</span><span>반응 자동화</span></button>
        <button class="nav-item" data-view="queue"><span class="nav-icon">▤</span><span>게시 대기열</span><span class="nav-dot"></span></button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon">⌁</span><span>성과 분석</span></button>
        <button class="nav-item" data-view="integrations"><span class="nav-icon">⚙</span><span>연동 · 보안</span></button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="nav-caption">빠른 실행</div>
      <button class="quick-create" data-action="compose"><span class="plus-mark">＋</span><span>새 콘텐츠 만들기</span><span class="shortcut">⌘ K</span></button>
      <div class="sidebar-spacer"></div>
      <div class="infra-card">
        <div class="infra-head"><span class="live-dot pending"></span><span>게시 인프라 · 미연동</span><button class="more-button" aria-label="더 보기">···</button></div>
        <div class="infra-ip">203.0.113.18 <span class="country-pill">예시</span></div>
        <div class="infra-caption">예시 주소 · 실제 경로 아님</div>
        <div class="infra-progress"><span></span></div>
        <div class="infra-foot"><span>운영 계정 연결</span><strong>0 / 20</strong></div>
      </div>
      <button class="profile-row"><div class="profile-avatar">민</div><div class="profile-copy"><strong>운영자 예시</strong><small>Preview 미인증</small></div><span class="chevron">⌄</span></button>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>varo 미디어</span><span class="crumb-slash">/</span><strong id="crumb-current">대시보드</strong></div>
      <div class="topbar-actions"><span class="demo-badge"><span></span>개발 · 미연동</span><button class="icon-button" aria-label="알림">♧<i></i></button><div class="top-avatar">민</div></div>
      </header>
      <section id="view-root" class="view-root" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/app.js"></script>
  <script src="/control-center.js"></script>
</body>
</html>
