<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f2ed"><title>인스타오토 운영</title><link rel="icon" href="./instaauto-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./readable.css"><link rel="stylesheet" href="./guidance.css"></head><body><div id="app"><main class="auth-wrap"><form id="login-form" class="panel auth-card"><img src="./instaauto-mark.svg" alt="" width="56"><h1>인스타오토 관리자 로그인</h1><p>인증된 관리자만 운영 데이터에 접근할 수 있습니다.</p><label for="email">이메일</label><input id="email" class="large-input" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" class="large-input" type="password" autocomplete="current-password" required><button class="btn btn-primary" type="submit">로그인</button><p id="login-error" role="alert"></p></form></main></div><div id="toast-root" class="toast-root" aria-live="polite"></div><script src="./app.js"></script></body></html>
